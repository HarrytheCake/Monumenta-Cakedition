# Cake multiloader kit: one build for every Minecraft version (<mc>/version.properties) and loader.
# Run Gradle with JDK 25: JAVA_HOME="C:/Program Files/Java/jdk-25.0.4" ./gradlew build
# Only some versions: ./gradlew build -Pcake.versions=1.20.4
# Targets: Fabric 1.20.4 (the Cakedition pack's), Fabric + NeoForge 26.1.2 (no 1.21.1, no NeoForge 1.20.4: user's choice).
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
# idle daemons give their memory back after 15 minutes (several builds run on this machine at once)
org.gradle.daemon.idletimeout=900000
org.gradle.parallel=false
org.gradle.caching=true

mod_id=cakecosmetic
mod_name=CakeCosmetic
mod_version=0.1.0
mod_group=io.github.harrythecake

# the CakeUI release CakeCosmetic compiles against (needs API version 2: fillPort, ADR 0008): its GitHub release
# jars cakeui-<loader>-<mc>-<version>.jar. Compiling against the oldest release that has the API keeps
# the "cakeui >= 0.2.0" dependency honest.
cakeui_version=0.2.0
# the CakeUI release dev runs (runClient, smoke.py) use: the newest, what the Cakedition pack ships
cakeui_run_version=0.3.0
# -Pcakeui_dir=../cakeui/build/libs uses a local multiloader build of CakeUI instead (unreleased CakeUI changes;
# its jars must carry cakeui_version in their names)
