modLoader = "javafml"
loaderVersion = "${neoforge_loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/HarrytheCake/CakeCosmetic/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "assets/cakecosmetic/icon.png"
authors = "HarrytheCake"
displayURL = "https://github.com/HarrytheCake/CakeCosmetic"
description = '''Choose the pictures behind Minecraft's main menu and loading screens from a gallery. On Monumenta, backgrounds unlock as you earn advancements. Pictures come from resource packs. Built on CakeUI.'''

[[mixins]]
config = "cakecosmetic.mixins.json"

[[dependencies.cakecosmetic]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.cakecosmetic]]
modId = "minecraft"
type = "required"
versionRange = "${neoforge_mc_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.cakecosmetic]]
modId = "cakeui"
type = "required"
versionRange = "[0.2.0,)"
ordering = "AFTER"
side = "CLIENT"
