# Builds the .mrpack from pack/ (tools/mrpack.py) on every push to the packwiz branch that changes the pack,
# and publishes it as release v<pack version>. Later pushes with the same version replace the file.
name: mrpack

on:
  push:
    branches: [packwiz]
    paths:
      - "pack/**"
      - "tools/mrpack.py"
      - "tools/packwiz_sync.py"
      - ".github/workflows/mrpack.yml"
      - ".github/release-notes.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mrpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        id: build
        run: |
          python tools/mrpack.py
          echo "version=$(grep -m1 '^version' pack/pack.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "file=$(ls mrpack/*.mrpack)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          FILE: ${{ steps.build.outputs.file }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file .github/release-notes.md
          else
            gh release create "v$VERSION" "$FILE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Monumenta Cakedition $VERSION" --notes-file .github/release-notes.md
          fi
