# Builds the .mrpack from pack/ (tools/mrpack.py) on every push to the packwiz branch that changes the pack,
# and publishes it as release v<pack version> with its changelog (pack/config/cakeupdater/changelog/<version>/)
# and SHA-256 in the notes, and as a new Modrinth version (tools/modrinth_publish.py; other runs only dry-run it).
# A released pack file never changes (docs/adr/0002): later pushes with the same version only refresh the notes.
name: mrpack

on:
  push:
    branches: [packwiz]
    paths:
      - "pack/**"
      - "tools/mrpack.py"
      - "tools/packwiz_sync.py"
      - "tools/modrinth_publish.py"
      - ".github/workflows/mrpack.yml"
      - ".github/release-notes.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mrpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        id: build
        run: |
          python tools/mrpack.py
          echo "version=$(grep -m1 '^version' pack/pack.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "file=$(ls mrpack/*.mrpack)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          FILE: ${{ steps.build.outputs.file }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          # This version's changelog (the same text players see in game) goes first, English then 简体中文.
          CHANGES="pack/config/cakeupdater/changelog/$VERSION"
          : > "$NOTES"
          if [ -f "$CHANGES/en_us.md" ]; then
            { printf '## Changes in %s\n\n' "$VERSION"; cat "$CHANGES/en_us.md"; printf '\n\n'; } >> "$NOTES"
          fi
          if [ -f "$CHANGES/zh_cn.md" ]; then
            { printf '## %s 更新内容\n\n' "$VERSION"; cat "$CHANGES/zh_cn.md"; printf '\n\n'; } >> "$NOTES"
          fi
          if [ -s "$NOTES" ]; then
            printf -- '---\n\n' >> "$NOTES"
          fi
          cat .github/release-notes.md >> "$NOTES"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A released pack file never changes (docs/adr/0002): keep it, refresh only the notes, with its own hash.
            echo "::warning::v$VERSION is already released, so its pack file stays as it is; bump the version to publish pack changes."
            gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "*.mrpack" --dir "$RUNNER_TEMP/released"
            FILE=$(ls "$RUNNER_TEMP"/released/*.mrpack)
          fi
          printf '\n---\n\n**SHA-256**\n```\n%s\n```\n' "$(cd "$(dirname "$FILE")" && sha256sum "$(basename "$FILE")")" >> "$NOTES"
          if [ -n "$(ls "$RUNNER_TEMP"/released/*.mrpack 2>/dev/null)" ]; then
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "v$VERSION" "$FILE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Monumenta Cakedition $VERSION" --notes-file "$NOTES"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      # A new release also becomes a Modrinth version (the first one, 2.2.2, was uploaded by hand: Q15).
      # Every other run is a dry run: it builds the request and checks the token without creating anything.
      - name: Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
          FILE: ${{ steps.release.outputs.file }}
          NEW: ${{ steps.release.outputs.new }}
        run: |
          if [ "$NEW" = "true" ]; then
            python tools/modrinth_publish.py "$VERSION" "$FILE" --publish
          else
            python tools/modrinth_publish.py "$VERSION" "$FILE"
          fi
