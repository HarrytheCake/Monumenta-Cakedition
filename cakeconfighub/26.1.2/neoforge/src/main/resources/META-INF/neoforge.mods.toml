modLoader = "javafml"
loaderVersion = "${neoforge_loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/HarrytheCake/CakeConfighub/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "assets/cakeconfighub/icon.png"
authors = "HarrytheCake"
displayURL = "https://github.com/HarrytheCake/CakeConfighub"
description = '''One screen for the UI and HUD options of many mods, written straight into each mod's own config file (comments and other settings kept). Modpacks can ship their own default values (applied at startup on Fabric only, for now).'''

[[dependencies.cakeconfighub]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.cakeconfighub]]
modId = "minecraft"
type = "required"
versionRange = "${neoforge_mc_range}"
ordering = "NONE"
side = "CLIENT"
