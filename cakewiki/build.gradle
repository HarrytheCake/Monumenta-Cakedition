plugins {
	id 'fabric-loom' version '1.10.5'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// only the config-screen API; Mod Menu is optional at runtime
	modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}

	// HTML parser for the wiki's rendered pages, bundled inside our jar (MIT)
	implementation "org.jsoup:jsoup:${project.jsoup_version}"
	include "org.jsoup:jsoup:${project.jsoup_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

loom {
	runs {
		client {
			// ./gradlew runClient -PdevShot="Page|item:Name|Page@300|Page!open": screenshot tour, see DevShots
			if (project.hasProperty("devShot")) property("cakewiki.devShot", project.property("devShot").toString())
		}
	}
}

test {
	useJUnitPlatform()
	// opt-in tests: -Dcakewiki.liveTest=true talks to the real wiki
	systemProperties System.getProperties().findAll { it.key.toString().startsWith("cakewiki.") }
	testLogging { showStandardStreams = System.getProperty("cakewiki.liveTest") == "true" }
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

jar {
	from("LICENSE") { rename { "LICENSE_${project.archives_base_name}" } }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}
