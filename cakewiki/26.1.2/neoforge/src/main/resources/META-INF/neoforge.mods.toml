modLoader = "javafml"
loaderVersion = "${neoforge_loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/HarrytheCake/CakeWiki/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "assets/cakewiki/icon.png"
authors = "HarrytheCake"
displayURL = "https://github.com/HarrytheCake/CakeWiki"
description = '''Reads the Monumenta Wiki (monumenta.wiki.gg) inside the game. Pages are fetched from the wiki when you open them; wiki text is CC BY-SA 4.0 and each page links back to its source.'''

[[mixins]]
config = "cakewiki.mixins.json"

[[dependencies.cakewiki]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.cakewiki]]
modId = "minecraft"
type = "required"
versionRange = "${neoforge_mc_range}"
ordering = "NONE"
side = "CLIENT"

# optional: pages translated with CakeText Translator 0.3.0+ (reached by reflection)
[[dependencies.cakewiki]]
modId = "caketext_translator"
type = "optional"
versionRange = "[0.3.0,)"
ordering = "NONE"
side = "CLIENT"
