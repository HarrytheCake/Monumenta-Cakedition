modLoader = "javafml"
loaderVersion = "${neoforge_loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/HarrytheCake/CakeUpdater/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "assets/cakeupdater/icon.png"
authors = "HarrytheCake"
displayURL = "https://github.com/HarrytheCake/CakeUpdater"
description = '''Tells you in chat when a Monumenta Cakedition update is out and installs it with packwiz-installer after you close the game. Keeps a backup of your server list and configs from before each update, which you can restore from its settings screen. Moving in from another pack? It imports your options and keybinds, UMM, Monumenta Addons, ChatPlus tabs (for CakeChat), Xaero's waypoints and map, and your server list.'''

[[mixins]]
config = "cakeupdater.neoforge.mixins.json"

[[dependencies.cakeupdater]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.cakeupdater]]
modId = "minecraft"
type = "required"
versionRange = "${neoforge_mc_range}"
ordering = "NONE"
side = "CLIENT"
