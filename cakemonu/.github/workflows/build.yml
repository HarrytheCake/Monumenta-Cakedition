# Builds and tests on every push and pull request (Fabric for Minecraft 1.20.4 for now; Cake multiloader
# kit, so more versions/loaders can be added later). A push to main whose mod_version has no release yet
# publishes release v<mod_version> with every jar:
#   cakemonu-fabric-1.20.4-<version>.jar   one per loader and Minecraft version
#   cakemonu-<version>.jar                 the Fabric 1.20.4 jar under a short name (for the Cakedition
#                                          modpack and tools/packwiz_sync.py)
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle runs on JDK 25 (the last one = JAVA_HOME); 1.20.4 compiles with 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_25_X64

      - name: Read mod version
        id: version
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Check the jars
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -l build/libs
          for f in "cakemonu-$VERSION.jar" "cakemonu-fabric-1.20.4-$VERSION.jar"; do
            test -f "build/libs/$f" || { echo "missing build/libs/$f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cakemonu-${{ steps.version.outputs.version }}
          path: build/libs/cakemonu-*${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cakemonu-${{ needs.build.outputs.version }}

      - name: Publish release (once per version)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION is already released; bump mod_version for a new release."
            exit 0
          fi
          SUMS=$(sha256sum cakemonu-*"$VERSION".jar)
          NOTES=$(printf '%s\n\n%s\n\n**SHA-256**\n```\n%s\n```\n' \
            "Fabric for Minecraft 1.20.4, for Unofficial Monumenta Mod 1.10. Needs Fabric API; CakeUI is optional (moving and resizing the icons)." \
            "\`cakemonu-$VERSION.jar\` and \`cakemonu-fabric-1.20.4-$VERSION.jar\` are the same jar." \
            "$SUMS")
          # --notes goes before the generated notes
          gh release create "v$VERSION" cakemonu-*"$VERSION".jar \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CakeMonu $VERSION" --generate-notes \
            --notes "$NOTES"
