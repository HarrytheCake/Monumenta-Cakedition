# Builds and tests on every push and pull request. A push to main whose mod_version
# has no release yet publishes the jar as release v<mod_version>; the modpack downloads it from there.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Read mod version
        id: version
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: cakechat-${{ steps.version.outputs.version }}
          path: build/libs/cakechat-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cakechat-${{ needs.build.outputs.version }}

      - name: Publish release (once per version)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION is already released; bump mod_version for a new release."
            exit 0
          fi
          # --notes goes before the generated notes
          SUMS=$(sha256sum "cakechat-$VERSION.jar")
          gh release create "v$VERSION" "cakechat-$VERSION.jar" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CakeChat $VERSION" --generate-notes \
            --notes "$(printf '**SHA-256**\n```\n%s\n```\n' "$SUMS")"
