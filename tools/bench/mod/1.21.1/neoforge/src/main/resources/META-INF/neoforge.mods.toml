modLoader = "javafml"
loaderVersion = "${neoforge_loader_range}"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "HarrytheCake"
description = '''Benchmark harness for Monumenta Cakedition: follows config/cakebench/plan.json through the scenes, records every frame's time and quits. Without a plan, /cakebench start ... stop records frame times, GPU timers and a spark profile while you play. Never shipped in the pack.'''

[[mixins]]
config = "cakebench.mixins.json"

[[dependencies.cakebench]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.cakebench]]
modId = "minecraft"
type = "required"
versionRange = "${neoforge_mc_range}"
ordering = "NONE"
side = "BOTH"
