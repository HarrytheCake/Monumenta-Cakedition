modLoader = "javafml"
loaderVersion = "${neoforge_loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/HarrytheCake/CakeBook/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "assets/cakebook/icon.png"
authors = "HarrytheCake"
displayURL = "https://github.com/HarrytheCake/CakeBook"
description = '''A guide book and small wiki you read in game: books written in Markdown, shipped by modpacks or resource packs, plus your own notes with links and locations. One search over all of it. Open it from the pause menu, the inventory, a key or /cakebook.'''

[[mixins]]
config = "cakebook.mixins.json"

[[dependencies.cakebook]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.cakebook]]
modId = "minecraft"
type = "required"
versionRange = "${neoforge_mc_range}"
ordering = "NONE"
side = "CLIENT"

# CakeConfighub calls this class's cakeconfighubReloadConfig() after writing our config (ADR 0013)
[modproperties.cakebook]
"cakeconfighub:reload" = "io.github.harrythecake.cakebook.ConfigReload"
